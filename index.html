<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Courses — Test Task</title>

    <!-- Styles -->
    <link rel="stylesheet" href="./dist/css/main.css" />
  </head>

  <body>
    <section class="courses">
      <div class="courses__container">
        <header class="courses__header">
          <p class="courses__tagline">Enjoy your studying!</p>
          <h1 class="courses__title">Our online courses</h1>
        </header>

        <div class="courses__controls">
          <ul class="courses__filters">
            <li class="courses__filter-item">
              <button
                class="courses__filter-button courses__filter-button_active"
                data-category="All"
              >
                All
              </button>
            </li>
            <li class="courses__filter-item">
              <button class="courses__filter-button" data-category="Marketing">
                Marketing
              </button>
            </li>
            <li class="courses__filter-item">
              <button class="courses__filter-button" data-category="Management">
                Management
              </button>
            </li>
            <li class="courses__filter-item">
              <button
                class="courses__filter-button"
                data-category="HR & Recruiting"
              >
                HR & Recruiting
              </button>
            </li>
            <li class="courses__filter-item">
              <button class="courses__filter-button" data-category="Design">
                Design
              </button>
            </li>
            <li class="courses__filter-item">
              <button
                class="courses__filter-button"
                data-category="Development"
              >
                Development
              </button>
            </li>
          </ul>

          <div class="search courses__search">
            <input
              type="text"
              class="search__input"
              placeholder="Search course..."
            />
          </div>
        </div>

        <div class="courses__grid"></div>

        <div class="load-more-wrapper">
          <img src="./assets/icons/spinner.svg" alt="" class="spinner hidden" />
          <button id="loadMoreBtn" class="courses__load-more">Load more</button>
        </div>
      </div>
    </section>

    <!-- Scripts -->
    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
