<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Courses — Test Task</title>

    <!-- Google Fonts - Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="./dist/css/main.css" />
  </head>

  <body>
    <section class="courses">
      <div class="courses__container">
        <div class="courses__heading">
          <p class="courses__subtitle">ENJOY YOUR STUDYING!</p>
          <h1 class="courses__title">Our online courses</h1>
        </div>

        <div class="courses__controls">
          <div class="categories">
            <button
              class="categories__tab categories__tab--active"
              data-category="All"
            >
              All
            </button>
            <button class="categories__tab" data-category="Marketing">
              Marketing
            </button>
            <button class="categories__tab" data-category="Management">
              Management
            </button>
            <button class="categories__tab" data-category="HR & Recruiting">
              HR & Recruiting
            </button>
            <button class="categories__tab" data-category="Design">
              Design
            </button>
            <button class="categories__tab" data-category="Development">
              Development
            </button>
          </div>

          <div class="search">
            <input
              type="text"
              class="search__input"
              placeholder="Search course..."
            />
          </div>
        </div>

        <div class="courses__grid"></div>

        <div class="load-more-wrapper">
          <img src="./assets/icons/spinner.svg" alt="" class="spinner hidden" />
          <button id="loadMoreBtn" class="courses__load-more">Load more</button>
        </div>
      </div>
    </section>

    <!-- Scripts -->
    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
